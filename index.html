<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>2026년 월간 뉴스레터 아카이브</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; margin: 0; background: #f8f9fa; }
        
        /* 헤더 영역 - 세련된 LG Red 적용 */
        .header { text-align: center; padding: 25px 20px; background: #A50034; color: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .header h1 { margin: 0; font-size: 24px; font-weight: bold; letter-spacing: -0.5px; }
        
        /* 버튼 메뉴 디자인 */
        .month-menu { display: flex; justify-content: center; gap: 10px; padding: 20px; background: #fff; border-bottom: 1px solid #eee; }
        
        /* 기본 버튼 스타일 */
        .month-menu button {
            padding: 10px 22px; border: 1px solid #ddd; background: #fafafa; color: #555;
            cursor: pointer; border-radius: 20px; font-weight: bold; transition: all 0.2s ease;
        }
        
        /* 마우스 호버 & 활성화(Active) 시 LG Red로 포인트 매칭 */
        .month-menu button:hover { background: #f5f5f5; border-color: #A50034; color: #A50034; }
        .month-menu button.active { background: #A50034; color: white; border-color: #A50034; box-shadow: 0 2px 5px rgba(165,0,52,0.2); } 
        
        /* 뉴스레터 표시 영역 */
        .content-area { max-width: 800px; margin: 20px auto; height: 100vh; background: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.06); border-radius: 8px; overflow: hidden; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div class="header">
        <h1>월간 뉴스레터 모아보기</h1>
    </div>

    <!-- 월별 버튼 영역 -->
    <div class="month-menu">
        <button onclick="showNewsletter('05.html', this)">5월</button>
        <button onclick="showNewsletter('06.html', this)" class="active">6월</button>
        <button onclick="showNewsletter('07.html', this)">7월</button>
    </div>

    <!-- 뉴스레터가 보여지는 영역 -->
    <div class="content-area">
        <!-- 기본값으로 가장 최신인 6월을 띄워둡니다 -->
        <iframe id="newsFrame" src="06.html"></iframe>
    </div>

    <script>
        // 버튼 클릭 시 화면을 바꿔주는 자바스크립트
        function showNewsletter(filename, btn) {
            document.getElementById('newsFrame').src = filename;
            
            // 모든 버튼의 활성화 색상 해제
            let buttons = document.querySelectorAll('.month-menu button');
            buttons.forEach(b => b.classList.remove('active'));
            
            // 방금 클릭한 버튼만 색상 활성화
            btn.classList.add('active');
        }
    </script>
</body>
</html>
